name: Downgrade

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ['1.10']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - name: Run julia version info
        run: julia --project -e 'import Pkg; Pkg.status()'
      - name: Run downgrade
        uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: LinearAlgebra,Test
          mode: forcedeps
      - name: Develop package and instantiate dependencies
        run: |
          julia --project -e 'import Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Check manifest
        run: julia --project -e 'import Pkg; Pkg.status()'
      - uses: julia-actions/julia-runtest@v1
        env:
          PYTHON: ""
